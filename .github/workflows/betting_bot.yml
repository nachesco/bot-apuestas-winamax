name: Sistema Automatizado de Apuestas +EV

on:
  schedule:
    - cron: '0 */3 * * *'  # Ejecución automática cada 3 horas para ahorrar cuota
  workflow_dispatch:         # Permite lanzarlo manualmente desde la pestaña Actions

jobs:
  ejecutar-bots:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas joblib python-dotenv

      - name: Ejecutar Bot de Fútbol
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_SECUNDARIA: ${{ secrets.ODDS_API_KEY_SECUNDARIA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_futbol.py

      - name: Ejecutar Bot Predictivo de Baloncesto
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_SECUNDARIA: ${{ secrets.ODDS_API_KEY_SECUNDARIA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_predictivo.py

      - name: Guardar cambios en la base de datos (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apuestas.db logs_bot.txt || true
          git commit -m "Actualización automática de apuestas y logs [skip ci]" || echo "No hay cambios que commitear"
          git push || echo "No hay cambios que pushear"