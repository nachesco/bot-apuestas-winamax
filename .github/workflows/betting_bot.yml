name: Sistema Automatizado de Apuestas +EV

on:
  schedule:
    - cron: '*/15 * * * *'  # Se ejecuta automáticamente cada 15 minutos
  workflow_dispatch:        # Te permite lanzarlo manualmente cuando quieras

jobs:
  ejecutar-bots:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # OBLIGATORIO: Permite al bot guardar y hacer commit/push en el repositorio

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Bot de Fútbol
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_futbol.py

      - name: Ejecutar Bot Predictivo de Baloncesto
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_predictivo.py

      - name: Ejecutar Liquidador de Apuestas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python liquidador.py

      - name: Guardar y sincronizar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apuestas.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de la base de datos [skip ci]" && git push)